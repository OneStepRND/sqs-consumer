[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sqs_consumer"
module-root = ""

[project]
name = "sqs-consumer"
version = "0.13.0"
description = "Consume Amazon SQS queues with health checks, graceful shutdown and dead letter queue support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.39.12",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:botocore.auth",
]

[dependency-groups]
dev = [
    "boto3-stubs[sqs]>=1.39.14",
    "freezegun>=1.5.3",
    "moto[sqs]>=5.1.8",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "urllib3>=2.5.0",
]
